<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="仿跳一跳小游戏截图占位">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20283a"/>
      <stop offset="1" stop-color="#33293c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- 左侧平台（等距方块） -->
  <g>
    <polygon points="140,250 210,285 140,320 70,285" fill="#8f7bff" opacity="0.85"/>
    <polygon points="70,285 140,320 140,375 70,340" fill="#6a5ae0" opacity="0.85"/>
    <polygon points="210,285 140,320 140,375 210,340" fill="#54469e" opacity="0.85"/>
  </g>

  <!-- 右侧平台 -->
  <g>
    <polygon points="510,255 580,290 510,325 440,290" fill="#8f7bff" opacity="0.85"/>
    <polygon points="440,290 510,325 510,380 440,345" fill="#6a5ae0" opacity="0.85"/>
    <polygon points="580,290 510,325 510,380 580,345" fill="#54469e" opacity="0.85"/>
  </g>

  <!-- 抛物线轨迹 -->
  <path d="M140 268 Q320 -60 510 273" fill="none" stroke="#eef1f7" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- 跳跃中的小人（蓄力起跳胶囊） -->
  <g transform="translate(322 100) rotate(18)">
    <rect x="-16" y="-34" width="32" height="56" rx="16" fill="#e65f5c"/>
    <circle cx="0" cy="-20" r="9" fill="#ffd9d6" opacity="0.9"/>
  </g>

  <!-- 得分气泡 -->
  <g>
    <rect x="362" y="60" width="60" height="30" rx="15" fill="#eef1f7" fill-opacity="0.12" stroke="#8f7bff" stroke-opacity="0.6"/>
    <text x="392" y="81" text-anchor="middle" fill="#eef1f7" font-family="system-ui, sans-serif" font-size="16" font-weight="600">+1</text>
  </g>

  <rect x="16" y="16" width="608" height="368" rx="10" fill="none" stroke="#8f7bff" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <text x="320" y="196" text-anchor="middle" fill="#eef1f7" font-family="system-ui, sans-serif" font-size="28" font-weight="600">仿跳一跳小游戏</text>
  <text x="320" y="228" text-anchor="middle" fill="#98a2b3" font-family="system-ui, sans-serif" font-size="14">截图占位 · 640×400 · 后续替换为 WebP</text>
</svg>
